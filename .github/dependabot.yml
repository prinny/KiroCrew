version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The adapters the Real Adapter Contract Tests lane drives (codex-acp, opencode).
  # A bump arrives as its own PR, and that PR's run of the lane is where adapter
  # drift shows up: the assertions in test_codex_session_mcp.py and
  # test_opencode_session_mcp.py were measured against the pinned release, so a
  # red there is a contract that moved, to be re-measured -- never relaxed. This
  # manifest is not the product's: the frontend and build lanes never read it.
  #
  # The cooldown waits a week after a release before proposing it. These are
  # executables the lane runs, so a just-published version that turns out to be
  # malicious or broken should have had its week in the open first.
  - package-ecosystem: "npm"
    directory: "/test/real_adapters"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "area: ci"
      - "area: tests"

  # The exact claude-agent-acp version install.sh, setup.sh and
  # minimal_install.sh install globally (read via
  # scripts/lib/acp-adapter-pin.sh). Same cooldown, same reason: an installer
  # should never pick up a release that has not had its week in the open.
  - package-ecosystem: "npm"
    directory: "/packaging/acp-adapters"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "area: packaging"
  # The website tree's own manifest. Until now this tree had no
  # version-update stream: its dependency PRs arrived only as
  # Dependabot security updates (the happy-dom bump in PR #25 came
  # that way), so routine website bumps had no stream to arrive in
  # and the dependency-review policy had nothing regular to attach
  # to. Same weekly cadence and cooldown as the other npm entries,
  # same reason: a just-published version should have had its week
  # in the open first.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "javascript"
